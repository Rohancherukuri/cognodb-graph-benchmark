[project]
name = "cognodb-graph-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "grpcio>=1.60.0",
    "neo4j>=5.22.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "pydgraph>=24.0.1",
    "pytest>=9.1.1",
    "python-arango>=8.1.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "requests>=2.32.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "integration: tests that require external services",
    "cognodb: tests that require CognoDB Cloud",
    "dataset: tests that require local benchmark datasets",
]
